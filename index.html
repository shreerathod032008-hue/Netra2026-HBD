<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something Special is Coming for Netra...</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Liquid Background Blobs -->
    <div class="blob-container">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="container">
        <section class="welcome-section">
            <h1 class="fade-in">Something is Coming for Netra...</h1>
            <p class="subtitle fade-in-delay">Mark your calendars for the most beautiful celebration yet.</p>
        </section>

        <section class="countdown-container glass">
            <div class="timer">
                <div class="time-group">
                    <span id="days">00</span>
                    <label>Days</label>
                </div>
                <div class="separator">:</div>
                <div class="time-group">
                    <span id="hours">00</span>
                    <label>Hours</label>
                </div>
                <div class="separator">:</div>
                <div class="time-group">
                    <span id="minutes">00</span>
                    <label>Min</label>
                </div>
                <div class="separator">:</div>
                <div class="time-group">
                    <span id="seconds">00</span>
                    <label>Sec</label>
                </div>
            </div>
        </section>

        <footer class="footer">
            <span class="liquid-glass-footer">Made with love by shree â¤ï¸ âœ¨</span>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
